events {}

http {
    # 1) Tipos MIME
    include       /etc/nginx/mime.types;               # caminho absoluto :contentReference[oaicite:4]{index=4}
    default_type  application/octet-stream;
    types {
        application/wasm wasm;                          # mapeia .wasm :contentReference[oaicite:5]{index=5}
    }

    # 2) Gzip básico
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;  # :contentReference[oaicite:6]{index=6}

    server {
        listen       8080;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        # 3) Blazor runtime
        location /_framework/ {
            try_files $uri $uri/ =404;                 # serve DLLs e runtime JS :contentReference[oaicite:7]{index=7}
        }

        # 4) Conteúdo de bibliotecas e CSS isolado
        location /_content/ {
            try_files $uri $uri/ =404;                 
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 5) Arquivos estáticos (CSS, JS, WASM, imagens, fontes…)
        location ~* \.(?:css|js|wasm|json|png|jpe?g|svg|eot|ttf|woff2?)$ {
            try_files $uri =404;                       # entrega direto do disco :contentReference[oaicite:8]{index=8}
            expires 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        # 6) SPA fallback: só aqui cai em index.html
        location / {
            try_files $uri $uri/ /index.html =404;     # último recurso :contentReference[oaicite:9]{index=9}
        }
    }
}
